<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Miami Waterfront Houses — JClaw</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-card: #1c2128;
  --bg-hover: #252c35;
  --border: #30363d;
  --border-light: #3d444d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --orange: #f0883e;
  --purple: #bc8cff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --teal: #39d3bb;
  --gold: #f0c060;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
}

.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  z-index: 1000;
  position: relative;
  flex-wrap: wrap;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo span { color: var(--accent); }
.logo .fox { font-size: 22px; }

.stats-bar {
  display: flex;
  gap: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: auto;
  flex-wrap: wrap;
}
.stat { display: flex; align-items: center; gap: 5px; }
.stat strong { color: var(--text-primary); }

.filter-row {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  z-index: 999;
  position: relative;
}
.filter-row select, .filter-row input {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.filter-row select:hover { border-color: var(--border-light); }
.filter-label { font-size: 12px; color: var(--text-secondary); }

.main {
  display: grid;
  grid-template-columns: 380px 1fr;
  height: calc(100vh - 94px);
}

.sidebar {
  background: var(--bg-primary);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.card:hover { border-color: var(--border-light); background: var(--bg-hover); transform: translateY(-1px); }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent)33; }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.card-address {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.3;
  flex: 1;
  margin-right: 8px;
}
.card-price {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
}

.card-meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  font-weight: 500;
  border: 1px solid;
}
.badge-ocean { color: var(--teal); border-color: var(--teal)44; background: var(--teal)11; }
.badge-bay { color: var(--accent); border-color: var(--accent)44; background: var(--accent)11; }
.badge-canal { color: var(--green); border-color: var(--green)44; background: var(--green)11; }
.badge-intracoastal { color: var(--purple); border-color: var(--purple)44; background: var(--purple)11; }
.badge-neighborhood { color: var(--text-secondary); border-color: var(--border); background: transparent; }

.card-details {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}
.card-details span { display: flex; align-items: center; gap: 3px; }

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.days-on-market {
  font-size: 11px;
  color: var(--text-muted);
}
.days-on-market.fresh { color: var(--green); }
.days-on-market.warm { color: var(--yellow); }
.days-on-market.stale { color: var(--red); }

.btn-link {
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent)44;
  padding: 3px 10px;
  border-radius: 5px;
  transition: all 0.15s;
}
.btn-link:hover { background: var(--accent)22; }

.card-notes {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  font-style: italic;
}

#map {
  z-index: 0;
}

.leaflet-popup-content-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
}
.leaflet-popup-tip { background: var(--bg-card); }
.popup-price { font-size: 15px; font-weight: 700; color: var(--gold); }
.popup-address { font-weight: 600; margin-bottom: 4px; }
.popup-meta { color: var(--text-secondary); font-size: 12px; margin-top: 4px; }
.popup-link { color: var(--accent); text-decoration: none; display: inline-block; margin-top: 6px; font-size: 12px; }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; grid-template-rows: 50vh 1fr; height: auto; }
  .sidebar { height: auto; max-height: 50vh; }
  #map { height: 50vh; }
  .header { height: auto; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="fox">🦊</span> Miami Waterfront Houses <span>for sale</span></div>
  <div class="stats-bar">
    <div class="stat">🏠 <strong id="stat-count">0</strong> listings</div>

<div class="filter-row">

  </select>

  <span class="filter-label">Sort:</span>

    <option value="price-asc">Price ↑</option>

</div>

<div class="main">

// ── Map setup ──────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: [25.7617, -80.1918],
  zoom: 11
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CartoDB',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

const MARKER_COLORS = {
  ocean: '#f0c060',
  bay: '#58a6ff',
  canal: '#3fb950',
  intracoastal: '#bc8cff'
};

function makeIcon(type) {
  const color = MARKER_COLORS[type] || '#8b949e';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z" fill="${color}" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="5" fill="rgba(0,0,0,0.3)"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [24, 36],
    iconAnchor: [12, 36],
    popupAnchor: [0, -36]
  });
}

function formatPrice(p) {
  if (p >= 1000000) return '$' + (p/1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  return '$' + Math.round(p/1000) + 'K';
}

function domClass(days) {
  if (days <= 7) return 'fresh';
  if (days <= 21) return 'warm';
  return 'stale';
}

function badgeClass(type) {
  return 'badge badge-' + (type || 'bay');
}

function domLabel(days) {
  if (days === 1) return '1 day on market';
  return days + ' days on market';
}

let markers = {};
let activeId = null;

function renderAll(props) {
  // Clear markers
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  // Stats
  document.getElementById('stat-count').textContent = props.length;
  if (props.length > 0) {
    const avg = props.reduce((s, p) => s + p.price_usd, 0) / props.length;
    document.getElementById('stat-avg').textContent = formatPrice(avg);
  } else {
    document.getElementById('stat-avg').textContent = '—';
  }

  // Sidebar
  const sidebar = document.getElementById('sidebar');
  if (props.length === 0) {
    sidebar.innerHTML = '<div class="no-results">🔍 No listings match your filters</div>';
    return;
  }

  sidebar.innerHTML = props.map(p => `
    <div class="card ${activeId === p.id ? 'active' : ''}" id="card-${p.id}" onclick="selectProperty('${p.id}')">
      <div class="card-top">
        <div class="card-address">${p.address}<br><small style="color:var(--text-muted);font-weight:400">${p.neighborhood}</small></div>
        <div class="card-price">${formatPrice(p.price_usd)}</div>
      </div>
      <div class="card-meta">
        <span class="${badgeClass(p.waterfront_type)}">${p.waterfront_type}</span>
        <span class="badge badge-neighborhood">${p.neighborhood}</span>
      </div>
      <div class="card-details">
        <span>🛏 ${p.beds}bd</span>
        <span>🛁 ${p.baths}ba</span>
        <span>📐 ${p.sqft.toLocaleString()} sqft</span>
      </div>
      <div class="card-footer">
        <div class="days-on-market ${domClass(p.days_on_market)}">${domLabel(p.days_on_market)}</div>
        <a href="${p.url}" target="_blank" class="btn-link" onclick="event.stopPropagation()">View →</a>
      </div>
      ${p.notes ? `<div class="card-notes">${p.notes}</div>` : ''}
    </div>
  `).join('');

  // Map markers
  props.forEach(p => {
    const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.waterfront_type) })
      .addTo(map)
      .bindPopup(`
        <div class="popup-address">${p.address}</div>
        <div class="popup-price">${formatPrice(p.price_usd)}</div>
        <div class="popup-meta">
          ${p.beds}bd / ${p.baths}ba · ${p.sqft.toLocaleString()} sqft<br>
          ${p.waterfront_type} · ${p.neighborhood}<br>
          ${domLabel(p.days_on_market)}
        </div>
        ${p.notes ? `<div class="popup-meta" style="margin-top:4px;font-style:italic">${p.notes}</div>` : ''}
        <a href="${p.url}" target="_blank" class="popup-link">View listing →</a>
      `);
    marker.on('click', () => selectProperty(p.id));
    markers[p.id] = marker;
  });
}

function selectProperty(id) {
  activeId = id;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card-' + id);
  if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  const marker = markers[id];
  if (marker) { map.panTo(marker.getLatLng()); marker.openPopup(); }
}

function applyFilters() {
  const type = document.getElementById('filter-type').value;
  const maxPrice = parseInt(document.getElementById('filter-price').value) || Infinity;
  const hood = document.getElementById('filter-hood').value;
  const sort = document.getElementById('filter-sort').value;

  let filtered = PROPERTIES.filter(p => {
    if (type && p.waterfront_type !== type) return false;
    if (p.price_usd > maxPrice) return false;
    if (hood && p.neighborhood !== hood) return false;
    return true;
  });

  if (sort === 'price-asc') filtered.sort((a, b) => a.price_usd - b.price_usd);
  else if (sort === 'price-desc') filtered.sort((a, b) => b.price_usd - a.price_usd);
  else if (sort === 'dom') filtered.sort((a, b) => a.days_on_market - b.days_on_market);
  else filtered.sort((a, b) => b.date_added.localeCompare(a.date_added)); // newest

  renderAll(filtered);
}

// Last updated
const lastUpdated = 'Apr 25, 2026';
document.getElementById('stat-updated').textContent = lastUpdated ? 'Updated ' + lastUpdated : 'Seeded Apr 20';

// Initial render
applyFilters();
</script>
